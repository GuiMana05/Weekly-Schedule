function calcSum(W){const O=occs(W,addD(W,6),true),c=cnt(O),n=c.n,pv=cnt(occs(addD(W,-7),addD(W,-1)));
if(!n&&!c.p)return null;
const e={f:c.f,a:c.a,x:c.x,p:c.p,r:n?pct(c.f,n):null,pr:pv.n?pct(pv.f,pv.n):null,low:n<10,bw:null,br:null,ww:null,wr:null,tk:'',tn:'',tx:0,tt:0,rk:'',rc:0,rt:0,st:'',sk:'',sp:0,ns:0};
const sg=sugg2();e.ns=sg.length;
if(!e.low){
const cd=[0,1,2,3,4,5,6].map(i=>{const q=cnt(O.filter(o=>o.w===i));return{i,n:q.n,r:q.n?q.f/q.n:0}}).filter(q=>q.n>=2);
if(cd.length>=3){const b=[...cd].sort((a,z)=>z.r-a.r)[0],w=[...cd].sort((a,z)=>a.r-z.r)[0];if(b.r>w.r){e.bw=b.i;e.br=Math.round(b.r*100);e.ww=w.i;e.wr=Math.round(w.r*100)}}
const g=grp(O).filter(x=>x.x>=2).sort((a,b)=>b.x-a.x||b.x/b.n-a.x/a.n)[0];if(g){e.tk=g.tid;e.tn=g.title;e.tx=g.x;e.tt=g.n}
const ws=O.filter(o=>o.s==='x').map(o=>S.why[o.id+':'+o.d]).filter(w=>w&&w.k!=='-'),m={};ws.forEach(w=>{const l=wl(w)||'Outro';m[l]=(m[l]||0)+1});
const tp=Object.entries(m).sort((a,b)=>b[1]-a[1])[0];if(tp){e.rk=tp[0];e.rc=tp[1];e.rt=ws.length}
if(sg[0]){e.st=sg[0].t;e.sk=sg[0].id;e.sp=1}
else if(e.ww!==null&&e.wr<80){e.st=`${DN[e.ww]} foi o teu dia mais difícil (${e.wr}% feito). Experimenta aliviar esse dia ou passar uma tarefa para um dia mais leve.`}
else if(e.tk&&S.tasks.some(t=>t.id===e.tk)){e.st=`«${e.tn}» foi a que mais falhou. Experimenta simplificá-la ou mudá-la de horário.`;e.sk=e.tk}
else e.st=e.r>=85?'Boa semana. Não é preciso mudar nada por agora.':'Sem padrões claros esta semana. Continua a registar.'}
return e}

const o=S.sums[W];if(o&&(o.cl||o.sd!==T))return null;const e=calcSum(W);if(!e)return null;e.sd=T;e.cl=0;
if(!o||cj(o)!==cj(e)){S.sums[W]=e;save()}return{W,e}}

cmp=d===null?'':d===0?' · igual à semana anterior':` · ${d>0?'+':'−'}${Math.abs(d)} pts face à semana anterior`,
ks=[['f','Feitas','--ok'],['a','Em atraso','--lt'],['x','Falhadas','--pn']].concat(e.p?[['p','Por fazer','--mu']]:[]),L=[];

/* ---------- cópias de segurança internas (coleções backups e bkdata, ou localStorage sem sincronização) ---------- */
const BKL='rotina-semanal-bk',BKK={d:7,w:4,p:3};
const BK={items:null,busy:false,ld:false,done:'',next:0,err:'',lerr:''};
const yr=s=>fmt(s)+' '+s.slice(0,4);
const bkWhen=m=>{const d=new Date(m.at);return yr(ds(d))+', '+pad(d.getHours())+':'+pad(d.getMinutes())};
const bkLabel=m=>m.k==='w'?'Semanal · semana de '+fmt(m.day):m.k==='p'?'Antes de restaurar':'Diária';
const kb=n=>n<1024?n+' B':(n<10240?(n/1024).toFixed(1).replace('.',','):Math.round(n/1024))+' KB';
const daysSince=ms=>Math.max(0,Math.round((new Date(T+'T12:00')-new Date(ds(new Date(ms))+'T12:00'))/864e5));
const b64=b=>new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]||'');f.onerror=j;f.readAsDataURL(b)});
async function bkEnc(str){const size=new Blob([str]).size;let z=0,txt=str;
if(typeof CompressionStream==='function'){try{txt=await b64(await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'))).blob());z=1}catch(e){z=0;txt=str}}
const cs=z?200000:60000,parts=[];for(let i=0;i<txt.length;i+=cs)parts.push(txt.slice(i,i+cs));if(!parts.length)parts.push('');
return{size,z,parts}}
async function bkDec(m,parts){const t=parts.join('');if(!m.z)return t;const bin=atob(t),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
const BKB={
async list(){if(SY.on){const s=await SY.db.collection('backups').limit(100).get();return s.docs.filter(d=>d.exists).map(d=>({...d.data(),id:d.id}))}
const o=lsGet(BKL)||{};return Object.keys(o).map(id=>{const{s,...m}=o[id];return{...m,id}})},
async put(id,m,parts){if(SY.on){for(let i=0;i<parts.length;i++)await SY.db.doc('bkdata/'+id+'_'+i).set({s:parts[i]});await SY.db.doc('backups/'+id).set({...m,n:parts.length})}
else{const o=lsGet(BKL)||{};o[id]={...m,n:1,s:parts.join('')};localStorage.setItem(BKL,JSON.stringify(o))}},
async get(m){if(SY.on){const a=[];for(let i=0;i<(m.n||1);i++){const d=await SY.db.doc('bkdata/'+m.id+'_'+i).get();if(!d.exists)throw new Error('missing');a.push(d.data().s)}return a}
const o=lsGet(BKL)||{};if(!o[m.id])throw new Error('missing');return[o[m.id].s]},
async del(m){if(SY.on){await SY.db.doc('backups/'+m.id).delete();for(let i=0;i<(m.n||1);i++)await SY.db.doc('bkdata/'+m.id+'_'+i).delete()}
else{const o=lsGet(BKL)||{};delete o[m.id];localStorage.setItem(BKL,JSON.stringify(o))}}};
async function bkSnap(){const d=exp(),e=await bkEnc(JSON.stringify(d));return{e,nt:d.tasks.length+d.atasks.length,nh:Object.keys(d.hist).length}}
const bkMeta=(k,x,day)=>({k,day,at:Date.now(),size:x.e.size,z:x.e.z,nt:x.nt,nh:x.nh});
/* mantém as últimas 7 diárias, 4 semanais e 3 de "antes de restaurar" */
async function bkPrune(){const list=await BKB.list();for(const k in BKK){const l=list.filter(x=>x.k===k).sort((a,b)=>(b.day||'').localeCompare(a.day||'')||b.at-a.at);for(const x of l.slice(BKK[k]))await BKB.del(x)}}
async function autoBackup(){if(BK.busy||BK.done===T||Date.now()<BK.next||!SY.ready||(SY.on&&(!SY.pulled||SY.ro)))return;
if(!S.tasks.length&&!S.atasks.length&&!Object.keys(S.hist).length){BK.done=T;return}
BK.busy=true;
try{const list=await BKB.list(),mk=monOf(T),hd=list.some(x=>x.id==='d-'+T),hw=list.some(x=>x.id==='w-'+mk);
if(!hd||!hw){const x=await bkSnap();if(!hd)await BKB.put('d-'+T,bkMeta('d',x,T),x.e.parts);if(!hw)await BKB.put('w-'+mk,bkMeta('w',x,mk),x.e.parts)}
await bkPrune();BK.done=T;BK.err=''}
catch(e){BK.err=e&&e.code==='quota_exceeded'?'Sem espaço para guardar cópias automáticas.':'Não foi possível guardar a cópia automática. Vai tentar de novo.';BK.next=Date.now()+120000}
BK.busy=false;BK.ld=false;loadBK()}
async function loadBK(){if(BK.ld||(SY.on&&!SY.pulled))return;BK.ld=true;
try{BK.items=(await BKB.list()).sort((a,b)=>b.at-a.at);BK.lerr=''}catch(e){BK.lerr='Não foi possível ler as cópias.';if(!BK.items)BK.items=[]}
BK.ld=false;if(tab==='def'&&!M&&!dr)render()}
let BKR=null;
function openBkr(id){const m=(BK.items||[]).find(x=>x.id===id);if(!m)return;BKR={m,busy:false};M='bkr';renderBkr();openM()}
function renderBkr(){const m=BKR.m;
$('#sheet').innerHTML=`<h2>Restaurar cópia</h2><p class="mu"><b>${esc(bkWhen(m))}</b><br>${esc(bkLabel(m))} · ${m.nt??'?'} tarefas · ${m.nh??'?'} registos no histórico</p><p class="mu">Os dados atuais (tarefas, histórico, folgas e motivos) passam a ser os desta cópia. Antes de restaurar, a app guarda uma cópia do estado atual, para poderes voltar atrás. O tema e o modo de interface não mudam.</p><div class="act"><button class="btn" data-m="cancel">Cancelar</button><button class="btn pri" data-m="bkgo"${BKR.busy?' disabled':''}>${BKR.busy?'A restaurar…':'Restaurar'}</button></div>`}
async function doRestore(){if(!BKR||BKR.busy)return;BKR.busy=true;renderBkr();let d;
try{const m=BKR.m;d=JSON.parse(await bkDec(m,await BKB.get(m)));if(!ok(d))throw new Error('bad')}
catch(e){BKR.busy=false;renderBkr();return toast('Não foi possível ler esta cópia')}
try{const x=await bkSnap();await BKB.put('p-'+Date.now(),bkMeta('p',x,T),x.e.parts)}
catch(e){BKR.busy=false;renderBkr();return toast('Não foi possível guardar o estado atual. Nada foi alterado.')}
replaceIn(d);BKR=null;closeM();render();toast('Cópia restaurada');
bkPrune().catch(()=>{}).then(()=>{BK.ld=false;loadBK()})}
async function bkDownload(id){const m=(BK.items||[]).find(x=>x.id===id);if(!m)return;let txt;

const d=new Date(m.at);await saveJson('rotina-semanal-copia-'+(m.k==='w'?'semana-':m.k==='p'?'antes-restaurar-':'')+m.day+(m.k==='p'?'-'+pad(d.getHours())+pad(d.getMinutes()):'')+'.json',txt)}
function boxBk(){const L=BK.items,lx=S.lx,dd=lx?daysSince(lx):0,

grp=(k,t)=>{const l=(L||[]).filter(x=>x.k===k);return l.length?`<div class="bkg">${t}</div>${l.map(x=>`<div class="bkr"><span><b>${esc(bkWhen(x))}</b><br><small>${k==='w'?'Semana de '+fmt(x.day)+' · ':''}${kb(x.size||0)}${x.nt!=null?' · '+x.nt+' tarefas':''}</small></span><span class="row">${SY.ro?'':`<button class="pb" data-a="bkrest" data-v="${esc(x.id)}">Restaurar</button>`}<button class="pb" data-a="bkdl" data-v="${esc(x.id)}">Descarregar</button></span></div>`).join('')}`:''};

return`<div class="box"><h3>Cópias de segurança</h3><p class="mu" style="margin:0 0 8px">A app guarda sozinha uma cópia por dia e uma por semana, no armazenamento do próprio artefacto${SY.resolved&&!SY.on?' (neste navegador, porque não há sincronização)':''}. Servem para desfazer erros. Se o artefacto for apagado, as cópias perdem-se com ele, e «Apagar tudo» não as apaga.</p><p class="mu" style="margin:0 0 10px">A app não consegue gravar ficheiros sozinha no teu aparelho. Por isso, de tempos a tempos, exporta um ficheiro e guarda-o fora do Claude.</p><p style="margin:0 0 10px">${exl}</p><div class="row"><button class="btn" data-a="export">⬇ Exportar ficheiro agora</button></div>${BK.err||BK.lerr?`<p class="mu" style="margin:10px 0 0;color:var(--pn)">${esc(BK.err||BK.lerr)}</p>`:''}${lst}</div>`}
